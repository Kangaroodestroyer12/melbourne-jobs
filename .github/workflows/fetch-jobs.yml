name: Fetch Melbourne jobs
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: melbourne-jobs-refresh
  cancel-in-progress: false
jobs:
  refresh:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Adzuna listings
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node scripts/fetch-jobs.js
      - name: Commit changed data
        run: |
          if ! git diff --quiet -- jobs.json || [ -n "$(git ls-files --others --exclude-standard jobs.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add jobs.json
            git commit -m 'Refresh Melbourne jobs from Adzuna'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN commits do not trigger another workflow/Pages build.
      # Deploy explicitly so scheduled data changes always reach the live site.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
      
